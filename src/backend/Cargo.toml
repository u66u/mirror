[package]
name = "mirror-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
actix-web = "4.9.0"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.5.5"
bytes = "1.8.0"
chacha20poly1305 = "0.10.1"
futures-util = "0.3.31"
getrandom = "0.2.15"
hmac = "0.12.1"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ipnet = "2.12.0"
nom-exif = "=3.6.0"
opendal = { version = "0.55.0", default-features = false, features = ["services-fs"] }
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "tracing", "api-24"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
schemars = "0.8.22"
sha2 = "0.10.8"
sha1 = "0.10.6"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "time"] }
subtle = "2.6.1"
tempfile = "3.14.0"
time = { version = "0.3.37", features = ["serde", "serde-well-known"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tracing = "0.1.41"
tracing-actix-web = "0.7.15"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tokio = { version = "1.43.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1.12.0", features = ["serde", "v7"] }
pgvector = { version = "0.4.2", features = ["sqlx"] }
thiserror = "2.0.18"
url = "2.5.7"
tokio-tar = { version = "0.3.1", default-features = false }
tokio-util = { version = "0.7.18", features = ["io"] }
wait-timeout = "0.2.1"
futures-channel = { version = "0.3.32", features = ["sink"] }

[lints]
workspace = true
